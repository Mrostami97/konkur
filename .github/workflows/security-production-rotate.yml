name: Private internal credential rotation

on:
  push:
    branches: [codex/security-hardening-2026-10-02]
    paths: [.github/workflows/security-production-rotate.yml]

permissions:
  contents: read

concurrency:
  group: security-production-rotate
  cancel-in-progress: false

jobs:
  rotate:
    if: github.repository == 'Mrostami97/konkur' && github.ref == 'refs/heads/codex/security-hardening-2026-10-02'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Rotate site-local database and storage credentials with private rollback state
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PRODUCTION_INSPECTION_PUBLIC_KEY: ${{ vars.PRODUCTION_INSPECTION_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          SSH_USER="${SSH_USER:-root}"
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/app}"
          [[ "${SSH_HOST:-}" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || { echo 'Invalid SSH host.' >&2; exit 1; }
          [[ "$SSH_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]] || { echo 'Invalid SSH user.' >&2; exit 1; }
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+$ ]] || { echo 'Invalid deployment path.' >&2; exit 1; }
          [ -n "${SSH_KNOWN_HOSTS:-}" ] || { echo 'Verified SSH host pin is required.' >&2; exit 1; }
          [ -n "${PRODUCTION_INSPECTION_PUBLIC_KEY:-}" ] || { echo 'Operator public encryption key is required.' >&2; exit 1; }
          umask 077
          known="$RUNNER_TEMP/rotation-known-hosts"
          key="$RUNNER_TEMP/rotation-key"
          report="$RUNNER_TEMP/rotation-report"
          trap 'rm -f -- "$known" "$key" "$report"' EXIT
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known"
          ssh-keygen -l -f "$known" >/dev/null
          ssh-keygen -F "$SSH_HOST" -f "$known" >/dev/null
          ssh_command=(ssh -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=20 -o ConnectionAttempts=1)
          if [ -n "${SSH_KEY:-}" ]; then
            printf '%s\n' "$SSH_KEY" > "$key"
            ssh_command+=(-o BatchMode=yes -i "$key")
          elif [ -n "${SSH_PASS:-}" ]; then
            sudo timeout --signal=TERM --kill-after=5s 90s apt-get update -qq
            sudo timeout --signal=TERM --kill-after=5s 90s apt-get install -y -qq sshpass
            export SSHPASS="$SSH_PASS"
            ssh_command=(sshpass -e "${ssh_command[@]}")
          else
            echo 'No existing SSH authentication is configured.' >&2
            exit 1
          fi
          remote="$SSH_USER@$SSH_HOST"
          rotation_status=0
          # Legacy absent-key compatibility was verified against real isolated
          # services; explicit empty/mismatching values still fail before mutation.
          # Only these reviewed helpers are sent. New credentials are generated
          # locally on the server, never returned to CI or printed in public logs.
          {
            for specification in \
              'ROTATION_SCRIPT:ops/rotate-internal-credentials.sh' \
              'ROTATION_HELPER:ops/rotate-internal-credentials.mjs' \
              'ROTATION_VALIDATOR:scripts/check-production-config.mjs'; do
              variable="${specification%%:*}"
              path="${specification#*:}"
              printf '%s_SHA256=%q\n' "$variable" "$(sha256sum "$path" | awk '{ print $1 }')"
              printf '%s_BASE64=%q\n' "$variable" "$(base64 -w0 "$path")"
            done
            cat <<'ROTATE'
          set -euo pipefail
          umask 077
          [ -d ops ] && [ ! -L ops ] || exit 1
          rotation_tools="$(mktemp -d "$PWD/ops/.rotation-tools-XXXXXX")"
          cleanup() {
            # Only the three temporary files made by this invocation.
            rm -f -- "$rotation_tools/rotate.sh" "$rotation_tools/rotate.mjs" "$rotation_tools/check.mjs"
            rmdir -- "$rotation_tools"
          }
          trap cleanup EXIT
          for specification in 'ROTATION_SCRIPT:rotate.sh' 'ROTATION_HELPER:rotate.mjs' 'ROTATION_VALIDATOR:check.mjs'; do
            variable="${specification%%:*}"
            path="$rotation_tools/${specification#*:}"
            digest_variable="${variable}_SHA256"
            content_variable="${variable}_BASE64"
            [[ "${!digest_variable}" =~ ^[a-f0-9]{64}$ ]] || exit 1
            printf '%s' "${!content_variable}" | base64 -d > "$path"
            [ "$(sha256sum "$path" | awk '{ print $1 }')" = "${!digest_variable}" ] || exit 1
          done
          bash -n "$rotation_tools/rotate.sh"
          ROTATE_INTERNAL_CREDENTIALS=1 \
            ROTATION_HELPER_PATH="$rotation_tools/rotate.mjs" \
            ROTATION_VALIDATOR_PATH="$rotation_tools/check.mjs" \
            timeout --signal=TERM --kill-after=420s 12m bash "$rotation_tools/rotate.sh" < /dev/null
          ROTATE
          } | "${ssh_command[@]}" "$remote" "cd '$DEPLOY_PATH' && bash -s" >"$report" 2>&1 || rotation_status=1
          chmod 600 "$report"
          node scripts/encrypt-production-inspection.mjs < "$report"
          if [ "$rotation_status" -ne 0 ]; then
            echo 'Internal rotation requires operator review; encrypted diagnostics were provided.' >&2
            exit 1
          fi
          echo 'Internal rotation completed; encrypted verification was provided.'
