name: Private unused RPC maintenance

on:
  push:
    branches: [codex/security-hardening-2026-10-02]
    paths: [.github/workflows/security-host-rpc.yml]

permissions:
  contents: read

concurrency:
  group: security-host-rpc
  cancel-in-progress: false

jobs:
  harden:
    if: github.repository == 'Mrostami97/konkur' && github.ref == 'refs/heads/codex/security-hardening-2026-10-02'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Disable unused RPC only after dependency and site checks
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          PRODUCTION_INSPECTION_PUBLIC_KEY: ${{ vars.PRODUCTION_INSPECTION_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          SSH_USER="${SSH_USER:-root}"
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/app}"
          [[ "${SSH_HOST:-}" =~ ^[a-zA-Z0-9][a-zA-Z0-9.-]*$ ]] || exit 1
          [[ "$SSH_USER" =~ ^[a-zA-Z_][a-zA-Z0-9_-]*$ ]] || exit 1
          [[ "$DEPLOY_PATH" =~ ^/[a-zA-Z0-9_./-]+$ ]] || exit 1
          [ -n "${SSH_KNOWN_HOSTS:-}" ] && [ -n "${PRODUCTION_INSPECTION_PUBLIC_KEY:-}" ] || exit 1
          umask 077
          known="$RUNNER_TEMP/rpc-known-hosts"
          key="$RUNNER_TEMP/rpc-key"
          report="$RUNNER_TEMP/rpc-report"
          trap 'rm -f -- "$known" "$key" "$report"' EXIT
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$known"
          ssh-keygen -l -f "$known" >/dev/null
          ssh-keygen -F "$SSH_HOST" -f "$known" >/dev/null
          ssh_command=(ssh -o StrictHostKeyChecking=yes -o "UserKnownHostsFile=$known" -o ConnectTimeout=20 -o ConnectionAttempts=1)
          if [ -n "${SSH_KEY:-}" ]; then
            printf '%s\n' "$SSH_KEY" > "$key"
            ssh_command+=(-o BatchMode=yes -i "$key")
          elif [ -n "${SSH_PASS:-}" ]; then
            sudo timeout --signal=TERM --kill-after=5s 90s apt-get update -qq
            sudo timeout --signal=TERM --kill-after=5s 90s apt-get install -y -qq sshpass
            export SSHPASS="$SSH_PASS"
            ssh_command=(sshpass -e "${ssh_command[@]}")
          else
            exit 1
          fi
          remote="$SSH_USER@$SSH_HOST"
          maintenance_status=0
          {
            printf 'RPC_SCRIPT_SHA256=%q\n' "$(sha256sum ops/disable-unused-rpcbind.sh | awk '{print $1}')"
            printf 'RPC_SCRIPT_BASE64=%q\n' "$(base64 -w0 ops/disable-unused-rpcbind.sh)"
            cat <<'HARDEN'
          set -euo pipefail
          umask 077
          [ -d ops ] && [ ! -L ops ] || exit 1
          rpc_tools="$(mktemp -d "$PWD/ops/.rpc-tools-XXXXXX")"
          cleanup() { rm -f -- "$rpc_tools/disable-rpc.sh"; rmdir -- "$rpc_tools"; }
          trap cleanup EXIT
          [[ "$RPC_SCRIPT_SHA256" =~ ^[a-f0-9]{64}$ ]] || exit 1
          printf '%s' "$RPC_SCRIPT_BASE64" | base64 -d > "$rpc_tools/disable-rpc.sh"
          [ "$(sha256sum "$rpc_tools/disable-rpc.sh" | awk '{print $1}')" = "$RPC_SCRIPT_SHA256" ] || exit 1
          bash -n "$rpc_tools/disable-rpc.sh"
          RPC_HARDENING=1 timeout --signal=TERM --kill-after=240s 3m bash "$rpc_tools/disable-rpc.sh" < /dev/null
          HARDEN
          } | "${ssh_command[@]}" "$remote" "cd '$DEPLOY_PATH' && bash -s" >"$report" 2>&1 || maintenance_status=1
          node scripts/encrypt-production-inspection.mjs < "$report"
          if [ "$maintenance_status" -ne 0 ]; then
            echo 'RPC maintenance requires review; encrypted diagnostics were provided.' >&2
            exit 1
          fi
          echo 'RPC maintenance completed; encrypted verification was provided.'
