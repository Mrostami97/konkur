name: CI

on:
  pull_request:
  push:
    branches: [main]

# On a branch, a newer push makes an in-flight run pointless. On main the
# run also deploys: cancelling it on every push meant that while commits kept
# landing a few minutes apart, no run ever reached the deploy. There, runs
# queue instead -- GitHub keeps at most one pending run per group, replacing
# it with the newest, so the queue never grows and the last commit deploys.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  packages: write

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: konkur
          POSTGRES_PASSWORD: konkur
          POSTGRES_DB: konkurcom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U konkur -d konkurcom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      SECURITY_TEST_DATABASE: "1"
      DATABASE_URL: postgresql://konkur:konkur@localhost:5432/konkurcom?schema=public
      SECURITY_TEST_DATABASE_URL: postgresql://konkur:konkur@localhost:5432/konkurcom?schema=public
      S3_ENDPOINT: localhost
      S3_PORT: "9000"
      S3_USE_SSL: "false"
      S3_ACCESS_KEY: konkur
      S3_SECRET_KEY: konkur123
      S3_BUCKET: konkurcom-media
      # Compose image/config gates use explicit disposable values. These are
      # never forwarded to the production SSH process or persisted on a VPS.
      POSTGRES_PASSWORD: ci-only-compose-postgres-2026
      MINIO_ROOT_PASSWORD: ci-only-compose-minio-2026
      # quay.io and Docker Hub stopped serving MinIO RELEASE.2025-09-07T16-13-09Z
      # (quay.io/minio/minio@sha256:14cea493…, the release the compose file still
      # pins). CI pulls our own private GHCR copy of that exact release instead,
      # pinned by digest; the step below logs in with the job token.
      MINIO_IMAGE: ghcr.io/mrostami97/minio:RELEASE.2025-09-07T16-13-09Z@sha256:e24674a10563b54e09c8ac768a17d4f65558d792ca8ee23dd3b8c4ab3bd9bd11

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # action-setup reads the pinned pnpm version from package.json's
      # `packageManager` field; setup-node then caches the pnpm store keyed on
      # the lockfile, which is the single biggest win on repeat runs.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Security and deployment script regressions
        env:
          BACKUP_SECURITY_DOCKER_TEST: "1"
          DEPLOYMENT_SECURITY_DOCKER_TEST: "1"
        run: |
          set -euo pipefail
          node --test scripts/test/check-security-audit.test.mjs \
            scripts/test/braces-remediation.test.mjs \
            scripts/test/encrypt-production-inspection.test.mjs \
            scripts/test/check-production-config.test.mjs \
            scripts/test/backup-security.test.mjs \
            scripts/test/deployment-security.test.mjs \
            scripts/test/rotation-security.test.mjs

      # Inspect dev and production dependencies. Network/format failures and
      # every new advisory fail this step; five short-lived unused-feature
      # exceptions are constrained by package/version/path and source guards.
      # The separately reported braces HIGH requires an exact local backport,
      # installed-code hashes and exploit regressions, with a review expiry.
      - name: Dependency security gate
        run: |
          set -euo pipefail
          audit_status=0
          pnpm audit --json > "$RUNNER_TEMP/dependency-audit.json" || audit_status=$?
          node scripts/check-security-audit.mjs \
            --audit-file "$RUNNER_TEMP/dependency-audit.json" \
            --audit-status "$audit_status"

      # Both are prerequisites for typecheck: apps/api imports @prisma/client's
      # generated types and @konkurcom/contracts by its built types entrypoint.
      # `pnpm -r run build` walks workspaces in topological order, so contracts
      # lands before api/web -- no separate contracts build step needed.
      - name: Generate Prisma Client and build workspaces
        run: |
          set -euo pipefail
          pnpm --filter @konkurcom/api exec prisma generate
          pnpm -w run build

      - name: Next request-prop compatibility regressions
        run: pnpm --filter @konkurcom/web run test:next-migration

      - name: Lint and typecheck
        run: |
          set -euo pipefail
          pnpm -w run lint
          pnpm -w run typecheck

      - name: Tests (contracts, migrations and API unit)
        run: |
          set -euo pipefail
          pnpm --filter @konkurcom/contracts run test
          pnpm --filter @konkurcom/web run test

          # migrate:down only ever undoes the latest applied migration, so a
          # drill aimed at an older one must first undo everything added after
          # it, newest first. The list is read from the migrations directory
          # rather than written out here: a hard-coded list silently broke the
          # drill the first time a newer migration landed. Every newer
          # migration's down.sql is exercised on the way.
          roll_back_after() {
            local target="$1"
            local migration
            for migration in $(ls -1 apps/api/prisma/migrations | grep -E '^[0-9]{14}_' | sort -r); do
              [ "$migration" = "$target" ] && return 0
              pnpm --filter @konkurcom/api run migrate:down -- "$migration"
            done
            echo "migration $target not found" >&2
            return 1
          }
          phase16=20260912120000_phase16_personal_learning_path

          pnpm --filter @konkurcom/api exec prisma migrate deploy
          roll_back_after "$phase16"
          pnpm --filter @konkurcom/api run migrate:down -- "$phase16"
          pnpm --filter @konkurcom/api run migration:verify:phase16 -- seed-legacy
          pnpm --filter @konkurcom/api exec prisma migrate deploy
          pnpm --filter @konkurcom/api run migration:verify:phase16 -- verify-backfill
          roll_back_after "$phase16"
          pnpm --filter @konkurcom/api run migrate:down -- "$phase16"
          pnpm --filter @konkurcom/api run migrate:down -- 20260909130000_phase15_admissions_sources
          pnpm --filter @konkurcom/api exec prisma migrate deploy
          pnpm --filter @konkurcom/api run migration:verify:phase16 -- cleanup

          # Verify every checked-in reversible migration, in strict reverse
          # order, against the now-clean test database, then re-apply them all:
          # their down paths must leave Prisma's migration ledger and the
          # pre-existing schema in a deployable state.
          roll_back_after "$phase16"
          pnpm --filter @konkurcom/api run migrate:down -- "$phase16"
          pnpm --filter @konkurcom/api run migrate:down -- 20260909130000_phase15_admissions_sources
          pnpm --filter @konkurcom/api run migrate:down -- 20260906200000_phase9_content_commerce
          pnpm --filter @konkurcom/api run migrate:down -- 20260906120000_password_auth
          pnpm --filter @konkurcom/api exec prisma migrate deploy
          pnpm --filter @konkurcom/api exec prisma migrate status
          pnpm --filter @konkurcom/api run test

      # Status codes depend on streaming behavior; verify the production Next
      # build against a controlled upstream, including topic 404 vs API outage.
      - name: Production routing and article SEO regressions
        env:
          WEB_ROUTING_MODE: production
        run: pnpm --filter @konkurcom/web run test:phase18:routing

      # Only four API e2e specs need real S3. Starting MinIO here keeps install,
      # compilation, linting, migrations, and unit tests independent from an
      # external container registry. GitHub Actions services cannot override
      # the image command, while MinIO requires `server /data`.
      - name: Start pinned MinIO for S3 integration tests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # The pinned image is our own GHCR copy (see MINIO_IMAGE above); a
          # package linked to this repository is readable with the job token.
          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          for attempt in 1 2 3; do
            if docker pull "$MINIO_IMAGE"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Unable to pull the pinned MinIO image after 3 attempts." >&2
              exit 1
            fi
            sleep $((attempt * 5))
          done

          docker run -d --pull=never --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=konkur -e MINIO_ROOT_PASSWORD=konkur123 \
            "$MINIO_IMAGE" server /data

          for _ in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live; then
              exit 0
            fi
            sleep 1
          done

          echo "MinIO did not become ready in time." >&2
          docker logs minio >&2 || true
          exit 1

      - name: API e2e tests
        run: |
          set +e
          E2E_RESULTS="$RUNNER_TEMP/api-e2e-results.json"
          pnpm --filter @konkurcom/api exec jest \
            --config jest.e2e.config.cjs \
            --runInBand \
            --json \
            --outputFile="$E2E_RESULTS"
          E2E_STATUS=$?
          set -e

          # Action log archives are served from a separate storage endpoint
          # that is not reachable in every support environment. Surface the
          # actual failing assertions as a check annotation as well, so a
          # failed integration test remains diagnosable through GitHub's API.
          if [ "$E2E_STATUS" -ne 0 ] && [ -s "$E2E_RESULTS" ]; then
            E2E_RESULTS="$E2E_RESULTS" node <<'NODE'
          const fs = require("node:fs");
          const report = JSON.parse(fs.readFileSync(process.env.E2E_RESULTS, "utf8"));
          const failures = report.testResults
            .flatMap((suite) => suite.assertionResults ?? [])
            .filter((test) => test.status === "failed")
            .slice(0, 5)
            .map((test) => `${test.fullName}\n${(test.failureMessages ?? []).join("\n")}`)
            .join("\n\n");
          const escaped = (failures || "Jest failed before reporting an assertion.")
            .slice(0, 4000)
            .replaceAll("%", "%25")
            .replaceAll("\r", "%0D")
            .replaceAll("\n", "%0A");
          console.log(`::error title=API e2e failures::${escaped}`);
          NODE
          fi

          exit "$E2E_STATUS"

      # Exercise the real production Next server against a real Nest/Postgres/
      # MinIO stack. Unit and corpus tests cannot prove HTTP status codes,
      # canonical metadata, generated sitemaps, RSS, or server-rendered HTML.
      - name: Public SSR and SEO smoke tests
        env:
          PORT: "3001"
          FRONTEND_URL: http://127.0.0.1:3012
          INTERNAL_API_URL: http://127.0.0.1:3001
          NEXT_PUBLIC_SITE_URL: https://kunkurcomputer.ir
          WEB_TEST_BASE_URL: http://127.0.0.1:3012
          WEB_TEST_CANONICAL_ORIGIN: https://kunkurcomputer.ir
        run: |
          set -euo pipefail

          API_LOG="$RUNNER_TEMP/api-ssr-smoke.log"
          WEB_LOG="$RUNNER_TEMP/web-ssr-smoke.log"
          API_PID=""
          WEB_PID=""
          cleanup() {
            [ -z "$WEB_PID" ] || kill "$WEB_PID" 2>/dev/null || true
            [ -z "$API_PID" ] || kill "$API_PID" 2>/dev/null || true
          }
          trap cleanup EXIT

          pnpm --filter @konkurcom/api run seed
          pnpm --filter @konkurcom/api run start >"$API_LOG" 2>&1 &
          API_PID=$!

          API_READY=0
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3001/healthz >/dev/null; then
              API_READY=1
              break
            fi
            sleep 1
          done
          if [ "$API_READY" -ne 1 ]; then
            echo "API did not become ready for SSR smoke tests." >&2
            cat "$API_LOG" >&2 || true
            exit 1
          fi

          pnpm --filter @konkurcom/web exec next start \
            --hostname 127.0.0.1 --port 3012 >"$WEB_LOG" 2>&1 &
          WEB_PID=$!

          WEB_READY=0
          for _ in $(seq 1 60); do
            if curl -sf http://127.0.0.1:3012/ >/dev/null; then
              WEB_READY=1
              break
            fi
            sleep 1
          done
          if [ "$WEB_READY" -ne 1 ]; then
            echo "Web did not become ready for SSR smoke tests." >&2
            cat "$WEB_LOG" >&2 || true
            exit 1
          fi

          set +e
          pnpm --filter @konkurcom/web run test:seo && \
            pnpm --filter @konkurcom/web run test:phase11:ssr && \
            pnpm --filter @konkurcom/web run test:phase12:ssr && \
            pnpm --filter @konkurcom/web run test:phase13:ssr && \
            SITE_URL=https://kunkurcomputer.ir SITE_FETCH_URL=http://127.0.0.1:3012 \
              pnpm run indexnow:submit -- --dry-run
          SSR_STATUS=$?
          set -e
          if [ "$SSR_STATUS" -ne 0 ]; then
            echo "SSR/SEO smoke test server logs:" >&2
            cat "$API_LOG" >&2 || true
            cat "$WEB_LOG" >&2 || true
            exit "$SSR_STATUS"
          fi

      # This isolated dev-server fixture supplies deterministic 404, 503 and
      # content-type responses. It verifies hard 404s and permanent redirects
      # without depending on mutable seed content.
      - name: Dynamic route HTTP semantics
        run: pnpm --filter @konkurcom/web run test:phase18:routing

      # Built here, on the runner, and shipped to the server as images below --
      # the server never compiles anything. Tags are compose's own defaults
      # (<project>-<service>), so the server's `docker compose up --no-build`
      # picks these up with no image: overrides in docker-compose.yml.
      - name: Build production images
        run: docker compose build api web

      - name: Validate production image runtimes and size
        run: |
          set -euo pipefail
          docker run --rm --entrypoint sh konkurcom-360-api:latest -ec \
            'test "$(id -u)" -ne 0 && test -f dist/main.js && test -f dist/bootstrap-admin.js && test -x node_modules/.bin/prisma && test -f scripts/check-production-config.mjs && "$PG_DUMP_BIN" --version | grep -q " 16." && probe="$(mktemp /tmp/security-runtime-XXXXXX)" && rm -- "$probe"'
          docker run --rm --entrypoint sh konkurcom-360-web:latest -ec \
            'test "$(id -u)" -ne 0 && test -f apps/web/server.js && test -d apps/web/.next/static && test -d apps/web/public && probe="$(mktemp /tmp/security-runtime-XXXXXX)" && rm -- "$probe" && mkdir -p apps/web/.next/cache && probe="$(mktemp apps/web/.next/cache/security-runtime-XXXXXX)" && rm -- "$probe"'

          API_BYTES="$(docker image inspect --format '{{.Size}}' konkurcom-360-api:latest)"
          WEB_BYTES="$(docker image inspect --format '{{.Size}}' konkurcom-360-web:latest)"
          TOTAL_BYTES=$((API_BYTES + WEB_BYTES))
          echo "API image: $((API_BYTES / 1024 / 1024)) MiB"
          echo "Web image: $((WEB_BYTES / 1024 / 1024)) MiB"
          echo "Combined images: $((TOTAL_BYTES / 1024 / 1024)) MiB"
          if [ "$API_BYTES" -gt $((900 * 1024 * 1024)) ] || \
             [ "$WEB_BYTES" -gt $((900 * 1024 * 1024)) ] || \
             [ "$TOTAL_BYTES" -gt $((1400 * 1024 * 1024)) ]; then
            echo "ERROR: production images exceed the bounded deployment budget." >&2
            exit 1
          fi

      # Exercise the exact bootstrap volume and nginx entrypoint path used on
      # the server. This catches regressions where a command override bypasses
      # nginx's template renderer and silently serves the stock welcome page.
      - name: Validate nginx TLS gateway bootstrap
        env:
          WEB_DOMAIN: kunkurcomputer.ir
          API_DOMAIN: api.kunkurcomputer.ir
          TLS_MODE: selfsigned
        run: |
          set -euo pipefail
          docker compose config --quiet
          docker compose run --rm --no-deps certs-init
          CERT_REUSE_OUTPUT="$(docker compose run --rm --no-deps certs-init)"
          echo "$CERT_REUSE_OUTPUT"
          echo "$CERT_REUSE_OUTPUT" | grep -q 'keeping it'
          docker compose run --rm --no-deps nginx \
            /bin/sh -ec '/docker-entrypoint.sh nginx -t'

      # Publish the already-tested production images to GHCR. Pulling registry
      # layers from the VPS is dramatically faster and resumable at the layer
      # level; the old single SSH archive transferred only 137 MiB in six hours.
      - name: Publish production images to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          REPOSITORY_LC="$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          API_IMAGE="ghcr.io/${REPOSITORY_LC}-api:${GITHUB_SHA}"
          WEB_IMAGE="ghcr.io/${REPOSITORY_LC}-web:${GITHUB_SHA}"

          printf '%s' "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          docker tag konkurcom-360-api:latest "$API_IMAGE"
          docker tag konkurcom-360-web:latest "$WEB_IMAGE"
          docker push "$API_IMAGE"
          docker push "$WEB_IMAGE"

      # Deploy is the tail of this same job: steps run in order and stop at the
      # first failure, so this only runs if everything above was green.
      #
      # Source is rsync'd from this runner's checkout, which already has
      # authenticated access to this private repo -- the server needs no git
      # credential of its own and doesn't even have to be a git checkout. If
      # the server has no rsync and none can be installed, it falls back to
      # cloning over HTTPS with this job's GITHUB_TOKEN.
      - name: Deploy to server, then wait for /healthz
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PASS: ${{ secrets.SSH_PASS }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
          DEPLOY_WEB_DOMAIN: ${{ vars.WEB_DOMAIN }}
          DEPLOY_API_DOMAIN: ${{ vars.API_DOMAIN }}
          DEPLOY_TRUSTED_PROXY_CIDRS: ${{ vars.TRUSTED_PROXY_CIDRS }}
          GH_TOKEN: ${{ github.token }}
          GHCR_USER: ${{ github.actor }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          if [ -z "${SSH_HOST:-}" ]; then
            echo "Deploy skipped: SSH_HOST secret is not set (see ops/runbook.md)."
            exit 0
          fi

          # Both are optional secrets; an unset DEPLOY_PATH previously produced
          # "ERROR:  is not a git checkout" against an empty path.
          DEPLOY_PATH="${DEPLOY_PATH:-/opt/app}"
          SSH_USER="${SSH_USER:-root}"
          DEPLOY_WEB_DOMAIN="${DEPLOY_WEB_DOMAIN:-kunkurcomputer.ir}"
          DEPLOY_API_DOMAIN="${DEPLOY_API_DOMAIN:-api.$DEPLOY_WEB_DOMAIN}"
          for domain in "$DEPLOY_WEB_DOMAIN" "$DEPLOY_API_DOMAIN"; do
            if ! printf '%s\n' "$domain" | grep -Eiq '^([a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?\.)+[a-z]{2,63}$'; then
              echo "ERROR: invalid deployment hostname: '$domain'." >&2
              exit 1
            fi
          done
          # This value is later single-quoted in an SSH command and stored in
          # .env. Reject all shell punctuation/newlines before that boundary,
          # then reuse the runtime's exact CIDR validation and normalize it.
          DEPLOY_TRUSTED_PROXY_CIDRS="$(node --input-type=module <<'CIDRS'
          import { validateProxyCidrs } from "./scripts/check-production-config.mjs";
          const value = process.env.DEPLOY_TRUSTED_PROXY_CIDRS ?? "";
          if (!/^[0-9a-fA-F:.,/ ]*$/u.test(value) || (value && !value.trim())) {
            console.error("ERROR: invalid characters in deployment trusted proxy CIDRs.");
            process.exit(1);
          }
          const errors = validateProxyCidrs(value);
          if (errors.length) {
            console.error("ERROR: deployment trusted proxy CIDRs are malformed or have a zero prefix.");
            process.exit(1);
          }
          console.log(value.trim().split(/[ ,]+/u).filter(Boolean).join(","));
          CIDRS
          )"
          REMOTE="$SSH_USER@$SSH_HOST"
          echo "Deploying to $REMOTE:$DEPLOY_PATH for https://$DEPLOY_WEB_DOMAIN"

          mkdir -p ~/.ssh
          if [ -z "${SSH_KNOWN_HOSTS:-}" ]; then
            echo "ERROR: configure SSH_KNOWN_HOSTS from the independently verified server host key before deployment."
            exit 1
          fi
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts
          ssh-keygen -lf ~/.ssh/known_hosts >/dev/null
          ssh-keygen -F "$SSH_HOST" -f ~/.ssh/known_hosts >/dev/null || {
            echo "ERROR: the verified host key does not cover SSH_HOST."
            exit 1
          }

          # SSH_KEY is primary; SSH_PASS is the fallback (via sshpass, reading
          # the password from the environment rather than argv).
          SSH_OPTIONS="-o StrictHostKeyChecking=yes -o UserKnownHostsFile=$HOME/.ssh/known_hosts -o ServerAliveInterval=30 -o ServerAliveCountMax=6 -o TCPKeepAlive=yes -o ConnectTimeout=30"
          if [ -n "${SSH_KEY:-}" ]; then
            printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
            chmod 600 ~/.ssh/deploy_key
            SSH="ssh -i $HOME/.ssh/deploy_key -o BatchMode=yes $SSH_OPTIONS"
          elif [ -n "${SSH_PASS:-}" ]; then
            sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
            export SSHPASS="$SSH_PASS"
            SSH="sshpass -e ssh $SSH_OPTIONS"
          else
            echo "ERROR: neither SSH_KEY nor SSH_PASS is set." >&2
            exit 1
          fi

          # ---- shared remote prelude -------------------------------------
          # Prepended to every remote script below, so sudo/Docker detection
          # lives in exactly one place.
          cat > /tmp/prelude.sh <<'PRELUDE'
          set -euo pipefail
          SUDO=""
          if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then
            SUDO="sudo"
          fi
          # Re-runnable on purpose: provisioning calls it again after install.
          detect_docker() {
            if docker info >/dev/null 2>&1; then
              DOCKER="docker"
            elif [ -n "$SUDO" ] && $SUDO docker info >/dev/null 2>&1; then
              DOCKER="$SUDO docker"
            else
              DOCKER=""
            fi
          }
          detect_docker
          PRELUDE

          run_remote() {  # run_remote <script> [VAR=val ...]
            local script="$1"; shift
            # Receive the entire script before executing it. Compose commands
            # keep stdin open by default and can otherwise swallow the rest of
            # a streamed bash -s program, producing a false successful deploy.
            cat /tmp/prelude.sh "$script" | $SSH "$REMOTE" "$* bash -c 'set -euo pipefail; umask 077; deploy_script=\$(mktemp /tmp/konkur-deploy-XXXXXXXX); cleanup() { rm -f -- \"\$deploy_script\"; }; trap cleanup EXIT; trap \"exit 129\" HUP; trap \"exit 130\" INT; trap \"exit 143\" TERM; cat > \"\$deploy_script\"; bash \"\$deploy_script\" < /dev/null'"
          }

          # ---- 1. provision ----------------------------------------------
          cat > /tmp/provision.sh <<'PROVISION'
          if ! command -v docker >/dev/null 2>&1; then
            echo "Docker not found -- installing."
            # The convenience script covers Debian/Ubuntu/Fedora but refuses
            # RHEL rebuilds ("Unsupported distribution 'almalinux'"), so fall
            # back to Docker's own CentOS repo, which is what Docker documents
            # for AlmaLinux/Rocky/RHEL.
            if ! curl -fsSL https://get.docker.com | $SUDO sh; then
              if command -v dnf >/dev/null 2>&1; then
                $SUDO dnf -y install dnf-plugins-core
                $SUDO dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
                $SUDO dnf -y install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              elif command -v yum >/dev/null 2>&1; then
                $SUDO yum -y install yum-utils
                $SUDO yum-config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
                $SUDO yum -y install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
              else
                echo "ERROR: no dnf/yum to install Docker with." >&2
                exit 1
              fi
            fi
            # The RPM packages don't start the daemon themselves.
            $SUDO systemctl enable --now docker || true
          fi
          $SUDO systemctl start docker >/dev/null 2>&1 || true
          detect_docker
          [ -n "$DOCKER" ] || { echo "ERROR: cannot reach the Docker daemon." >&2; exit 1; }
          $DOCKER compose version >/dev/null 2>&1 || { echo "ERROR: Docker compose plugin is missing." >&2; exit 1; }

          # Keep deployments from exhausting the host with build cache and
          # unreferenced layers. These commands never prune named volumes or an
          # image referenced by a running/stopped container.
          echo "== Reclaiming safe Docker cache =="
          $DOCKER image prune -f >/dev/null || true
          $DOCKER builder prune -af >/dev/null || true

          # rsync is how the source arrives; install it if the image is minimal.
          if ! command -v rsync >/dev/null 2>&1; then
            if command -v dnf >/dev/null 2>&1; then $SUDO dnf -y install rsync || true
            elif command -v yum >/dev/null 2>&1; then $SUDO yum -y install rsync || true
            elif command -v apt-get >/dev/null 2>&1; then
              $SUDO apt-get update -qq && $SUDO apt-get install -y -qq rsync || true
            fi
          fi

          # On RHEL-family hosts firewalld is usually on and blocks 80/443.
          if command -v firewall-cmd >/dev/null 2>&1 && $SUDO firewall-cmd --state >/dev/null 2>&1; then
            $SUDO firewall-cmd --permanent --add-service=http --add-service=https >/dev/null 2>&1 || true
            $SUDO firewall-cmd --reload >/dev/null 2>&1 || true
          fi

          $SUDO mkdir -p "$DEPLOY_PATH"
          $SUDO chown -R "$(id -u):$(id -g)" "$DEPLOY_PATH"

          # Runner build output is already inside the images shipped below; it
          # must not consume a second copy of the same data in the source tree.
          DEPLOY_ROOT="$(realpath -m "$DEPLOY_PATH")"
          case "$DEPLOY_ROOT" in
            /|/opt|/var|/usr|/root|/home)
              echo "ERROR: refusing cleanup for broad DEPLOY_PATH '$DEPLOY_ROOT'." >&2
              exit 1
              ;;
            /*) ;;
            *)
              echo "ERROR: DEPLOY_PATH must resolve to an absolute path." >&2
              exit 1
              ;;
          esac

          for relative in \
            apps/web/.next \
            apps/api/dist \
            contracts/dist \
            .turbo \
            coverage \
            playwright-report \
            test-results
          do
            target="$DEPLOY_ROOT/$relative"
            case "$target" in
              "$DEPLOY_ROOT"/*) $SUDO rm -rf -- "$target" ;;
              *)
                echo "ERROR: cleanup target escaped DEPLOY_PATH: $target" >&2
                exit 1
                ;;
            esac
          done

          echo "== Disk after safe cleanup =="
          df -h "$DEPLOY_ROOT"
          AVAILABLE_KB="$(df -Pk "$DEPLOY_ROOT" | awk 'NR == 2 { print $4 }')"
          if [ -z "$AVAILABLE_KB" ] || [ "$AVAILABLE_KB" -lt 2097152 ]; then
            echo "ERROR: deployment needs at least 2 GiB free after cleanup." >&2
            $DOCKER system df || true
            exit 1
          fi

          # Reported back so the runner knows how to talk to this server.
          command -v rsync >/dev/null 2>&1 && echo "has_rsync=yes" || echo "has_rsync=no"
          [ "$DOCKER" = "docker" ] && echo "docker_sudo=no" || echo "docker_sudo=yes"
          PROVISION

          echo "== Provisioning server =="
          PROVISION_OUT="$(run_remote /tmp/provision.sh "DEPLOY_PATH='$DEPLOY_PATH'")"
          echo "$PROVISION_OUT"

          # ---- 2. ship the source (compose file, ops/, Dockerfiles) -------
          echo "== Shipping source =="
          if echo "$PROVISION_OUT" | grep -q 'has_rsync=yes'; then
            # --delete keeps the server free of files deleted upstream, but
            # .env and private backups live only on the server and must survive.
            rsync -az --delete \
              --exclude '.git' --exclude '.env' --exclude '.deploy-images' --exclude 'node_modules' \
              --exclude '.next' --exclude 'dist' --exclude '.turbo' \
              --exclude 'coverage' --exclude 'playwright-report' --exclude 'test-results' \
              --exclude '/ops/backups/' \
              -e "$SSH" ./ "$REMOTE:$DEPLOY_PATH/"
          else
            echo "No rsync on the server -- falling back to a token-authenticated clone."
            cat > /tmp/clone.sh <<'CLONE'
          # git runs in a container so the host never needs it installed;
          # buildpack-deps:*-scm is an official image that already ships git.
          # The token is this job's GITHUB_TOKEN (repo-scoped, expires with the
          # job), and the remote is rewritten afterwards so it isn't persisted.
          $DOCKER run --rm -v "$DEPLOY_PATH:/repo" -w /repo \
            -e GH_TOKEN="$GH_TOKEN" -e REPO="$REPO" buildpack-deps:bookworm-scm sh -c '
              git config --global --add safe.directory /repo
              [ -d .git ] || git init -q -b main .
              git remote remove origin 2>/dev/null || true
              git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
              git fetch --depth 1 origin main
              git reset --hard FETCH_HEAD
              git remote set-url origin "https://github.com/${REPO}.git"
            '
          CLONE
            run_remote /tmp/clone.sh \
              "DEPLOY_PATH='$DEPLOY_PATH'" "REPO='$REPO'" "GH_TOKEN='$GH_TOKEN'"
          fi

          # ---- 3. pull the images built above -----------------------------
          # The VPS downloads compressed, content-addressed layers from GHCR.
          # This avoids the extremely slow runner-to-VPS SSH data path and lets
          # Docker reuse completed layers on retries.
          REPOSITORY_LC="$(printf '%s' "$REPO" | tr '[:upper:]' '[:lower:]')"
          API_IMAGE="ghcr.io/${REPOSITORY_LC}-api:${GITHUB_SHA}"
          WEB_IMAGE="ghcr.io/${REPOSITORY_LC}-web:${GITHUB_SHA}"

          cat > /tmp/pull-images.sh <<'PULL_IMAGES'
          case "$API_IMAGE" in
            ghcr.io/*-api:*) ;;
            *) echo "ERROR: invalid API image reference." >&2; exit 1 ;;
          esac
          case "$WEB_IMAGE" in
            ghcr.io/*-web:*) ;;
            *) echo "ERROR: invalid web image reference." >&2; exit 1 ;;
          esac

          DOCKER_CONFIG_DIR="$(mktemp -d)"
          cleanup_registry_auth() {
            if [ "$DOCKER" = "docker" ]; then
              docker --config "$DOCKER_CONFIG_DIR" logout ghcr.io >/dev/null 2>&1 || true
            else
              $SUDO docker --config "$DOCKER_CONFIG_DIR" logout ghcr.io >/dev/null 2>&1 || true
            fi
            rm -rf -- "$DOCKER_CONFIG_DIR"
          }
          trap cleanup_registry_auth EXIT

          if [ "$DOCKER" = "docker" ]; then
            printf '%s' "$GH_TOKEN" | docker --config "$DOCKER_CONFIG_DIR" login ghcr.io -u "$GHCR_USER" --password-stdin
            docker --config "$DOCKER_CONFIG_DIR" pull "$API_IMAGE"
            docker --config "$DOCKER_CONFIG_DIR" pull "$WEB_IMAGE"
          else
            printf '%s' "$GH_TOKEN" | $SUDO docker --config "$DOCKER_CONFIG_DIR" login ghcr.io -u "$GHCR_USER" --password-stdin
            $SUDO docker --config "$DOCKER_CONFIG_DIR" pull "$API_IMAGE"
            $SUDO docker --config "$DOCKER_CONFIG_DIR" pull "$WEB_IMAGE"
          fi

          $DOCKER image inspect "$API_IMAGE" >/dev/null
          $DOCKER image inspect "$WEB_IMAGE" >/dev/null
          $DOCKER tag "$API_IMAGE" konkurcom-360-api:latest
          $DOCKER tag "$WEB_IMAGE" konkurcom-360-web:latest

          # Remove only obsolete archives from the old bounded staging folder.
          OLD_IMAGE_DIR="$DEPLOY_PATH/.deploy-images"
          case "$OLD_IMAGE_DIR" in
            /*/.deploy-images)
              find "$OLD_IMAGE_DIR" -maxdepth 1 -type f -name 'konkur-images-*.tar.gz' -delete 2>/dev/null || true
              ;;
          esac
          PULL_IMAGES
          run_remote /tmp/pull-images.sh \
            "DEPLOY_PATH='$DEPLOY_PATH'" \
            "API_IMAGE='$API_IMAGE'" \
            "WEB_IMAGE='$WEB_IMAGE'" \
            "GHCR_USER='$GHCR_USER'" \
            "GH_TOKEN='$GH_TOKEN'"

          # ---- 4. start services, then wait for /healthz -------------------
          cat > /tmp/up.sh <<'UP'
          cd "$DEPLOY_PATH"
          # Persist the validated production hostnames so manual compose
          # restarts and host reboots use the same public routing as CI.
          touch .env
          chmod 600 .env
          assignments=("WEB_DOMAIN=$WEB_DOMAIN" "API_DOMAIN=$API_DOMAIN")
          # An unset repository variable preserves the server's established
          # proxy allowlist. Do not export an empty TRUSTED_PROXY_CIDRS that
          # would override the value Docker Compose reads from .env.
          if [ -n "${DEPLOY_TRUSTED_PROXY_CIDRS:-}" ]; then
            assignments+=("TRUSTED_PROXY_CIDRS=$DEPLOY_TRUSTED_PROXY_CIDRS")
          fi
          for assignment in "${assignments[@]}"; do
            key="${assignment%%=*}"
            if grep -q "^${key}=" .env; then
              sed -i "s|^${key}=.*|${assignment}|" .env
            else
              printf '%s\n' "$assignment" >> .env
            fi
          done

          # Offline credential/config checks run from the already-tested API
          # image. Failure leaves every currently running service untouched.
          $DOCKER compose run --rm --no-deps --entrypoint node api \
            scripts/check-production-config.mjs --require-credentials

          # Back up an existing running database before any restart/recreate.
          # First provisioning has no Postgres container and therefore no dump.
          RUNNING_POSTGRES="$($DOCKER compose ps --status running --quiet postgres)"
          if [ -n "$RUNNING_POSTGRES" ]; then
            BACKUP_USE_SUDO=0
            [ "$DOCKER" = "docker" ] || BACKUP_USE_SUDO=1
            DOCKER_BIN=docker DOCKER_USE_SUDO="$BACKUP_USE_SUDO" bash ops/backup.sh
          else
            echo "No running Postgres container; skipping first-provision backup."
          fi

          # --no-build: use the images the runner just shipped. Falling back to
          # a local build keeps a botched image transfer from taking the site
          # down, at the cost of a slow deploy.
          $DOCKER compose up -d --no-build || $DOCKER compose up -d --build

          # Health alone can pass against the previous containers. Prove both
          # running application services use this release's tested GHCR images
          # and the non-root uid declared by both production Dockerfiles.
          for service in api web; do
            case "$service" in api) release_image="$API_IMAGE" ;; web) release_image="$WEB_IMAGE" ;; esac
            expected_id="$($DOCKER image inspect --format '{{.Id}}' "$release_image")"
            container_id="$($DOCKER compose ps --status running --quiet "$service")"
            [[ "$expected_id" =~ ^sha256:[a-f0-9]{64}$ && "$container_id" =~ ^[a-f0-9]{12,64}$ ]] || {
              echo "ERROR: cannot verify the running $service release image." >&2; exit 1;
            }
            actual_id="$($DOCKER inspect --format '{{.Image}}' "$container_id")"
            [ "$actual_id" = "$expected_id" ] || {
              echo "ERROR: running $service does not use the tested release image." >&2; exit 1;
            }
            runtime_uid="$($DOCKER compose exec -T "$service" id -u)"
            [ "$runtime_uid" = 1000 ] || {
              echo "ERROR: running $service does not use the required non-root uid." >&2; exit 1;
            }
          done

          # Every deploy leaves the previous images behind; on the small VPS
          # they filled the disk and Postgres could no longer start. Images
          # in use by a container are never removed; volumes are untouched.
          $DOCKER image prune -a -f --filter "until=24h" || true
          $DOCKER builder prune -a -f --filter "until=24h" || true

          # nginx reads its config from a mounted template that is rendered
          # only when the container starts, and `up` leaves an unchanged
          # container running -- so a new template would never load. Render
          # it again and reload gracefully (no dropped connections); if the
          # new config does not pass `nginx -t`, the running one stays.
          $DOCKER compose exec -T nginx sh -ec \
            '/docker-entrypoint.d/20-envsubst-on-templates.sh >/dev/null && nginx -t && nginx -s reload' \
            || { echo "ERROR: gateway configuration was not rendered, validated and reloaded." >&2; exit 1; }

          # /healthz reports real connectivity to every dependency the API has
          # (Postgres, MinIO/S3), not just "the process started". Hit both the
          # API and the web app through nginx by IP via --resolve so a deploy
          # cannot be marked healthy while the public site returns 502. curl
          # runs in a container too, not assumed to be on the host.
          WEB_DOMAIN="$(grep -E '^WEB_DOMAIN=' .env 2>/dev/null | cut -d= -f2- || true)"
          WEB_DOMAIN="${WEB_DOMAIN:-localhost}"
          RESPONSE=""
          API_HEALTHY=0
          for _ in $(seq 1 60); do
            RESPONSE="$($DOCKER run --rm --network host curlimages/curl:latest \
              -sk --resolve "${WEB_DOMAIN}:443:127.0.0.1" \
              "https://${WEB_DOMAIN}/api/healthz" || true)"
            if echo "$RESPONSE" | grep -q '"status":"ok"'; then
              API_HEALTHY=1
              echo "API healthy: $RESPONSE"
              break
            fi
            sleep 3
          done

          if [ "$API_HEALTHY" -ne 1 ]; then
            echo "ERROR: API not healthy after 180s. Inspect service logs privately on the server." >&2
            $DOCKER compose ps || true
            exit 1
          fi

          WEB_STATUS=""
          WEB_HEALTHY=0
          for _ in $(seq 1 60); do
            WEB_STATUS="$($DOCKER run --rm --network host curlimages/curl:latest \
              -sk -o /dev/null -w '%{http_code}' \
              --resolve "${WEB_DOMAIN}:443:127.0.0.1" \
              "https://${WEB_DOMAIN}/" || true)"
            if [ "$WEB_STATUS" = "200" ]; then
              echo "Web healthy: HTTPS / returned 200."
              WEB_HEALTHY=1
              break
            fi
            sleep 3
          done

          if [ "$WEB_HEALTHY" -ne 1 ]; then
            echo "ERROR: web not healthy after 180s. Inspect web and gateway logs privately on the server." >&2
            $DOCKER compose ps || true
            exit 1
          fi

          # The cached public pages (home, courses, exams, ...) were first rendered at build time,
          # when the API was not there. Drop those copies through the same internal call the API
          # uses after an edit, then render each once, so neither a visitor nor the CDN gets an
          # empty page. A failure here is only a warning: the pages renew themselves in a minute.
          $DOCKER compose exec -T api node -e \
            "fetch(process.env.WEB_INTERNAL_URL + '/internal/revalidate', { method: 'POST' }).then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))" \
            || echo "WARNING: the public page cache was not refreshed after deploy." >&2
          for page in / /courses /exams /lesson-notes /free-videos; do
            $DOCKER run --rm --network host curlimages/curl:latest -sk -o /dev/null \
              --resolve "${WEB_DOMAIN}:443:127.0.0.1" "https://${WEB_DOMAIN}${page}" || true
          done

          # A bootstrap self-signed certificate is enough for containers to
          # start, but not enough for users or search crawlers. Keep the deploy
          # open until Certbot has installed a publicly trusted certificate and
          # nginx has reloaded it. Deliberately omit -k here.
          TRUSTED_TLS_STATUS=""
          TRUSTED_TLS=0
          for _ in $(seq 1 120); do
            TRUSTED_TLS_STATUS="$($DOCKER run --rm --network host curlimages/curl:latest \
              -sS -o /dev/null -w '%{http_code}' \
              --resolve "${WEB_DOMAIN}:443:127.0.0.1" \
              "https://${WEB_DOMAIN}/" 2>/dev/null || true)"
            if [ "$TRUSTED_TLS_STATUS" = "200" ]; then
              TRUSTED_TLS=1
              echo "Trusted TLS active: HTTPS / returned 200 without -k."
              break
            fi
            sleep 3
          done

          if [ "$TRUSTED_TLS" -ne 1 ]; then
            echo "ERROR: no trusted public TLS certificate after 360s. Inspect certificate and gateway logs privately on the server." >&2
            $DOCKER compose ps || true
            exit 1
          fi

          REDIRECT_HEADERS="$($DOCKER run --rm --network host curlimages/curl:latest \
            -sS -D - -o /dev/null \
            --resolve "${WEB_DOMAIN}:80:127.0.0.1" \
            "http://${WEB_DOMAIN}/phase18-probe" || true)"
          printf '%s\n' "$REDIRECT_HEADERS" | tr -d '\r' | grep -q '^HTTP/1.1 308'
          printf '%s\n' "$REDIRECT_HEADERS" | tr -d '\r' \
            | grep -Fqi "location: https://${WEB_DOMAIN}/phase18-probe"
          echo "Canonical HTTP redirect verified for $WEB_DOMAIN."
          printf 'Deployment complete for release %s.\n' "$DEPLOY_RELEASE"
          UP

          echo "== Starting services and waiting for /healthz =="
          deploy_status=0
          DEPLOY_OUTPUT="$(run_remote /tmp/up.sh \
            "DEPLOY_PATH='$DEPLOY_PATH'" \
            "WEB_DOMAIN='$DEPLOY_WEB_DOMAIN'" \
            "API_DOMAIN='$DEPLOY_API_DOMAIN'" \
            "DEPLOY_TRUSTED_PROXY_CIDRS='$DEPLOY_TRUSTED_PROXY_CIDRS'" \
            "API_IMAGE='$API_IMAGE'" "WEB_IMAGE='$WEB_IMAGE'" \
            "DEPLOY_RELEASE='$GITHUB_SHA'")" || deploy_status=$?
          printf '%s\n' "$DEPLOY_OUTPUT"
          [ "$deploy_status" -eq 0 ] || exit "$deploy_status"
          printf '%s\n' "$DEPLOY_OUTPUT" | grep -Fxq "Deployment complete for release $GITHUB_SHA." || {
            echo "ERROR: remote deployment did not reach verified release completion." >&2; exit 1;
          }
