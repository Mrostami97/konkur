name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same ref makes an in-flight run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: konkur
          POSTGRES_PASSWORD: konkur
          POSTGRES_DB: konkurcom
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U konkur -d konkurcom"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://konkur:konkur@localhost:5432/konkurcom?schema=public
      S3_ENDPOINT: localhost
      S3_PORT: "9000"
      S3_USE_SSL: "false"
      S3_ACCESS_KEY: konkur
      S3_SECRET_KEY: konkur123
      S3_BUCKET: konkurcom-media

    steps:
      - uses: actions/checkout@v4

      # action-setup reads the pinned pnpm version from package.json's
      # `packageManager` field; setup-node then caches the pnpm store keyed on
      # the lockfile, which is the single biggest win on repeat runs.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      # MinIO boots in the background while dependencies install, so the
      # readiness wait below almost always returns immediately. It can't be a
      # `services:` entry: that block can't override a container's command,
      # and the minio image requires `server /data`.
      - name: Install dependencies (MinIO boots in parallel)
        run: |
          set -euo pipefail
          docker run -d --name minio -p 9000:9000 \
            -e MINIO_ROOT_USER=konkur -e MINIO_ROOT_PASSWORD=konkur123 \
            minio/minio server /data
          pnpm install --frozen-lockfile
          for _ in $(seq 1 30); do
            if curl -sf http://localhost:9000/minio/health/live; then exit 0; fi
            sleep 1
          done
          echo "MinIO did not become ready in time" >&2
          exit 1

      # Both are prerequisites for typecheck: apps/api imports @prisma/client's
      # generated types and @konkurcom/contracts by its built types entrypoint.
      # `pnpm -r run build` walks workspaces in topological order, so contracts
      # lands before api/web -- no separate contracts build step needed.
      - name: Generate Prisma Client and build workspaces
        run: |
          set -euo pipefail
          pnpm --filter @konkurcom/api exec prisma generate
          pnpm -w run build

      - name: Lint and typecheck
        run: |
          set -euo pipefail
          pnpm -w run lint
          pnpm -w run typecheck

      - name: Tests (contracts, migrations, API unit + e2e)
        run: |
          set -euo pipefail
          pnpm --filter @konkurcom/contracts run test
          pnpm --filter @konkurcom/api exec prisma migrate deploy
          pnpm --filter @konkurcom/api run test
          pnpm --filter @konkurcom/api run test:e2e

      # Deploy runs as the tail of this same job: steps run in order and stop
      # at the first failure, so nothing below runs unless everything above
      # was green. The `secrets` context isn't available in a step `if:`,
      # hence this gate step writing an output. When it's skipped (PRs, or
      # non-main pushes) its output is empty, so the deploy step is skipped too.
      - name: Check deploy secrets
        id: deploy_gate
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          if [ -n "${{ secrets.SSH_HOST }}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "Deploy skipped: SSH_HOST secret is not set (see ops/runbook.md)."
          fi

      - name: Deploy over SSH, then wait for /healthz
        if: steps.deploy_gate.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          # SSH_KEY is primary; SSH_PASS is an optional password fallback. SSH
          # negotiates which offered method the server accepts, so passing
          # both is safe even when only one is set.
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASS }}
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"

            SUDO=""
            if [ "$(id -u)" -ne 0 ] && command -v sudo >/dev/null 2>&1; then
              SUDO="sudo"
            fi

            echo "== Prerequisites =="
            if ! command -v docker >/dev/null 2>&1; then
              echo "Docker not found -- installing."
              # The convenience script covers Debian/Ubuntu/Fedora but refuses
              # RHEL rebuilds ("Unsupported distribution 'almalinux'"), so fall
              # back to Docker's own CentOS repo, which is what Docker
              # documents for AlmaLinux/Rocky/RHEL.
              if ! curl -fsSL https://get.docker.com | $SUDO sh; then
                echo "Convenience script failed -- using the RHEL/CentOS package repo."
                if command -v dnf >/dev/null 2>&1; then
                  $SUDO dnf -y install dnf-plugins-core
                  $SUDO dnf config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
                  $SUDO dnf -y install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
                elif command -v yum >/dev/null 2>&1; then
                  $SUDO yum -y install yum-utils
                  $SUDO yum-config-manager --add-repo https://download.docker.com/linux/centos/docker-ce.repo
                  $SUDO yum -y install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
                else
                  echo "ERROR: no supported package manager (dnf/yum) to install Docker with." >&2
                  exit 1
                fi
              fi
              # The RPM packages don't start the daemon themselves.
              $SUDO systemctl enable --now docker || true
            fi

            if ! command -v docker >/dev/null 2>&1; then
              echo "ERROR: Docker installation failed. Install Docker Engine + the compose plugin manually, then re-run." >&2
              exit 1
            fi

            # Use sudo for docker only if this user can't reach the daemon
            # directly (fresh install, not yet in the `docker` group -- which
            # wouldn't take effect until a new login anyway).
            $SUDO systemctl start docker >/dev/null 2>&1 || true
            if docker info >/dev/null 2>&1; then
              DOCKER="docker"
            elif [ -n "$SUDO" ] && $SUDO docker info >/dev/null 2>&1; then
              DOCKER="$SUDO docker"
            else
              echo "ERROR: cannot reach the Docker daemon (and no sudo to retry as root)." >&2
              exit 1
            fi

            if ! $DOCKER compose version >/dev/null 2>&1; then
              echo "ERROR: Docker is installed but the compose plugin is missing." >&2
              exit 1
            fi

            # Best effort: on RHEL-family hosts firewalld is usually on and
            # blocks 80/443 by default. Never fatal.
            if command -v firewall-cmd >/dev/null 2>&1 && $SUDO firewall-cmd --state >/dev/null 2>&1; then
              $SUDO firewall-cmd --permanent --add-service=http --add-service=https >/dev/null 2>&1 || true
              $SUDO firewall-cmd --reload >/dev/null 2>&1 || true
            fi

            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              echo "ERROR: $DEPLOY_PATH is not a git checkout. This repo is private, so the first clone needs a credential set up by hand once (see ops/runbook.md)." >&2
              exit 1
            fi

            cd "$DEPLOY_PATH"

            echo "== Updating checkout =="
            # git runs in a container so the host never needs it installed
            # (a missing host git is what broke an earlier deploy).
            # buildpack-deps:*-scm is an official image that already ships
            # git, so there's no apt-get on every deploy.
            $DOCKER run --rm -v "$PWD:/repo" -w /repo buildpack-deps:bookworm-scm sh -c "
              git config --global --add safe.directory /repo
              git fetch origin main
              git reset --hard origin/main
            "

            echo "== Building and starting services =="
            $DOCKER compose up -d --build

            echo "== Waiting for /healthz =="
            # /healthz reports real connectivity to every dependency the API
            # has (Postgres, MinIO/S3), not just "the process started". Hit it
            # through nginx by IP via --resolve so no public DNS is needed.
            # curl runs in a container too, not assumed to be on the host.
            API_DOMAIN="$(grep -E '^API_DOMAIN=' .env 2>/dev/null | cut -d= -f2- || true)"
            API_DOMAIN="${API_DOMAIN:-api.localhost}"
            RESPONSE=""
            for _ in $(seq 1 60); do
              RESPONSE="$($DOCKER run --rm --network host curlimages/curl:latest \
                -sk --resolve "${API_DOMAIN}:443:127.0.0.1" \
                "https://${API_DOMAIN}/healthz" || true)"
              if echo "$RESPONSE" | grep -q '"status":"ok"'; then
                echo "Healthy: $RESPONSE"
                exit 0
              fi
              sleep 3
            done

            echo "ERROR: not healthy after 180s. Last /healthz response: ${RESPONSE:-<no response>}" >&2
            $DOCKER compose ps || true
            $DOCKER compose logs --tail 50 api || true
            exit 1
