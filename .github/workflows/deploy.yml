name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secrets are configured
        id: check
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip (no server configured yet)
        if: steps.check.outputs.configured == 'false'
        run: |
          echo "Deploy skipped: SSH_HOST secret is not set."
          echo "See ops/runbook.md for which secrets to add once a server exists."

      - name: Deploy over SSH
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          # SSH_KEY is the primary method; SSH_PASS is an optional fallback
          # (password auth) if no key is configured for the deploy user.
          # The SSH protocol itself negotiates which offered method the
          # server accepts, so passing both is safe even when only one is set.
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASS }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build
