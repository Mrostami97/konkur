name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check deploy secrets are configured
        id: check
        run: |
          if [ -z "${{ secrets.SSH_HOST }}" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip (no server configured yet)
        if: steps.check.outputs.configured == 'false'
        run: |
          echo "Deploy skipped: SSH_HOST secret is not set."
          echo "See ops/runbook.md for which secrets to add once a server exists."

      - name: Deploy over SSH
        if: steps.check.outputs.configured == 'true'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          # SSH_KEY is the primary method; SSH_PASS is an optional fallback
          # (password auth) if no key is configured for the deploy user.
          # The SSH protocol itself negotiates which offered method the
          # server accepts, so passing both is safe even when only one is set.
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASS }}
          script: |
            set -euo pipefail
            cd "${{ secrets.DEPLOY_PATH }}"
            git fetch origin main
            git reset --hard origin/main
            docker compose up -d --build

            # Post-deploy smoke check: /healthz reports real connectivity to
            # every dependency the API actually has (Postgres, MinIO/S3), not
            # just "the process started". Read API_DOMAIN the same way
            # docker-compose does (from .env in this directory, default
            # api.localhost) and hit it through nginx by IP so no public DNS
            # is required for the check itself.
            API_DOMAIN="$(grep -E '^API_DOMAIN=' .env 2>/dev/null | cut -d= -f2- || true)"
            API_DOMAIN="${API_DOMAIN:-api.localhost}"
            RESPONSE=""
            for i in $(seq 1 30); do
              RESPONSE="$(curl -sk --resolve "${API_DOMAIN}:443:127.0.0.1" "https://${API_DOMAIN}/healthz" || true)"
              if echo "$RESPONSE" | grep -q '"status":"ok"'; then
                echo "Deploy healthy:"
                echo "$RESPONSE"
                exit 0
              fi
              sleep 2
            done
            echo "Deploy did not become healthy within 60s. Last /healthz response:"
            echo "$RESPONSE"
            exit 1
