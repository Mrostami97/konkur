name: Feature request
description: Propose a focused improvement to the public project
title: "feat: "
labels: []
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What user or maintainer problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Describe the smallest useful behavior or interface change.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Optional approaches or workarounds you considered.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web
        - API
        - Database / migrations
        - Contracts / validation
        - Content / editorial tooling
        - CI / deployment / ops
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Security, privacy, migration, or compatibility considerations
      description: Note any relevant risks or write "None known".
