# Include again in locations with add_header, which replace inherited headers.
# Preserve inline Next hydration/JSON-LD and existing public-page caching.
# A nonce-based script-element policy needs an explicit dynamic/cache design.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; script-src-attr 'none'; upgrade-insecure-requests" always;
